# THE MAC-SIDE ROUTER FOR TIER-B SWEEPS.  docs/HPC_RUNBOOK.md 6, docs/GPU_RUNBOOK.md 8.
#
# WHY THIS FILE HAS TO EXIST.  `LiteLLMClient` holds ONE base url for every role
# (src/pinq_adapters/llm/litellm_client.py: `self._base_url = base_url or
# env.get("LITELLM_BASE_URL")`) -- there is no per-model base-url map.  But a Tier-B sweep
# needs two endpoints at once: the Inquirer on the tunnelled vLLM at 127.0.0.1:8000, and the
# frozen Drafter/Answerer/user-sim/judge on the team gateway.  A proxy on :4000 that routes by
# MODEL NAME is the only way to give one base url two destinations.
#
# NO SECRET IS IN THIS FILE.  The gateway key is read from the environment at proxy start
# (`os.environ/LITELLM_API_KEY`, out of `.env`), never written here.
#
# WHY THE GATEWAY URL IS `PINQ_GATEWAY_BASE_URL` AND NOT `LITELLM_BASE_URL`.  The sweep sets
# `LITELLM_BASE_URL=http://127.0.0.1:4000` so the harness talks to this proxy.  If the
# passthrough below also read `LITELLM_BASE_URL` it would resolve to the proxy itself and every
# gateway call would loop back into :4000.  A separate name makes that impossible rather than
# merely unlikely.  Launch with:
#   set -a; . ./.env; set +a
#   PINQ_GATEWAY_BASE_URL="$LITELLM_BASE_URL" <venv>/bin/litellm --config conf/serving/litellm.yaml --port 4000
#
# WHY `enable_thinking: false`.  Qwen3 is a hybrid-reasoning model and its chat template emits
# a `<think>` channel by default.  The rung-1 SFT rows were built with it OFF
# (`build_chat_masked_example(..., enable_thinking=False)`; the checkpoint evaluator records
# `"enable_thinking": false` in every artifacts/eval/*.tierA.json), and
# tests/test_chat_template_identity.py sends the same kwarg to `/tokenize`.  A served prompt
# with the thinking channel on is a DIFFERENT PROMPT than the one the adapter was fitted to,
# and the dev NLL that selected this checkpoint would not describe what the policy sees.

model_list:
  # ----------------------------------------------------------- local, tunnelled vLLM (free)
  # `hosted_vllm/` is litellm's OpenAI-compatible vLLM provider; the name after the slash is
  # what vLLM itself publishes -- the --served-model-name for the base, the --lora-modules
  # name for the adapter.  scripts/price_tables/2026-09.json already carries $0 rows for both.
  - model_name: qwen3-8b-base
    litellm_params:
      model: hosted_vllm/qwen3-8b-base
      api_base: http://127.0.0.1:8000/v1
      api_key: "not-used-vllm-is-open"
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

