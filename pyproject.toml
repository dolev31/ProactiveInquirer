[project]
name = "proactive-inquirer"
version = "0.1.0"
description = "Horizontal and vertical proactivity in agents: need graphs that measure what an agent pursues unasked, and Q&D, which trains it."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
# pinq is STDLIB-ONLY. Anything here would break the released wheel's coexistence with torch pins.
dependencies = []

[project.optional-dependencies]
suites   = ["httpx>=0.27", "datasets>=2.19"]
tau2     = ["tau2 @ git+https://github.com/sierra-research/tau2-bench@v1.0.1", "rank_bm25>=0.2.2"]
pare     = ["proactive-agents-research-environment @ git+https://github.com/deepakn97/pare@main"]
judge    = ["litellm>=1.40", "pydantic>=2.7"]
mine     = ["transformers>=4.42", "torch>=2.3", "sentencepiece>=0.2"]
analysis = ["duckdb>=1.0", "pyarrow>=16", "pandas>=2.2", "scipy>=1.13", "statsmodels>=0.14", "matplotlib>=3.9"]
serve    = ["fastapi>=0.111", "uvicorn>=0.30"]
run      = ["litellm>=1.40", "tenacity>=8.3", "PyYAML>=6"]
# EVERY MODULE rungs 1-2 ACTUALLY IMPORT. This read
#   ["torch", "vllm", "trl", "peft", "dspy-ai"]
# which omitted `transformers` (imported by both trainers, declared only in [mine]) and
# `datasets` (imported by rung 2, declared only in [suites]) -- so `pip install -e ".[train]"`
# produced an environment in which BOTH trainers still ImportError. It also declared
# `dspy-ai`, which nothing in src/ imports: rung 0 implements GEPA itself (OpenAIReflector).
# `vllm` is kept because rung 3 checks for it, and is marked as rung-3-only.
train    = ["torch>=2.3", "transformers>=4.42", "trl>=0.9", "peft>=0.11", "datasets>=2.19"]
train-grpo = ["vllm>=0.9"]  # rung 3 only; train() raises by design until validated
dev      = ["pytest>=8.3", "pytest-cov>=5.0", "hypothesis>=6.100", "import-linter>=2.0", "ruff>=0.9"]

[project.scripts]
pi = "pi_run.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Prompts are DATA that governs run identity: promptlib hashes these files into
# RunManifest.prompt_hashes. A wheel that shipped without them would import fine and then
# raise MissingPrompt on the first rollout, so they are declared package data, not fixtures.
[tool.setuptools.package-data]
pinq = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "firewall: gold-leakage firewall guarantees",
  "property: invariants that must hold for all inputs",
  "determinism: draft() purity and replay",
  "integration: requires an external service or a large download",
  "slow: long-running",
]

[tool.coverage.run]
source = ["pinq", "pi_eval", "pi_run"]
branch = true

[tool.coverage.report]
# Floor, not a target. Only ever ratchets up.
fail_under = 30

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# RESULTS ARE NOT SOURCE. ruff formats code fences inside Markdown, so a plain
# `ruff format .` rewrote a quoted snippet in a results document from a keyword
# argument into a tuple assignment (`exploratory=True,` -> `exploratory = (True,)`),
# silently falsifying a quotation cited as evidence. Measured 2026-09-17: 0 .py files
# live here, so nothing real loses linting. The home-path scan still covers this tree.
# AS-RUN COPIES ARE NOT REFORMATTED. scripts/seedrep4/hpc/ holds the job scripts exactly as they ran
# on the cluster; their sha256s are recorded in artifacts/seedrep4_20260924/ADDENDUM_A2.md and in
# the job logs, so `ruff format` or `--fix` would break the only link between a result and the code
# that produced it. Measured 2026-09-23: all 7 of its .py files would be reformatted and one has 3
# lint findings (lora_dist_check.py, a copy of the paper lane's scratch script).
extend-exclude = ["artifacts", "scripts/seedrep4/hpc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.importlinter]
root_packages = ["pinq", "pinq_adapters", "pinq_expt", "pi_eval", "pi_run", "pinq_train"]

[[tool.importlinter.contracts]]
name = "Nothing outside pi_eval may import pi_eval (the gold firewall)"
type = "forbidden"
source_modules = ["pinq", "pinq_adapters", "pinq_expt", "pinq_train"]
forbidden_modules = ["pi_eval"]

[[tool.importlinter.contracts]]
name = "pinq is stdlib-only (no first-party deps either)"
type = "forbidden"
source_modules = ["pinq"]
forbidden_modules = ["pinq_adapters", "pinq_expt", "pi_eval", "pi_run", "pinq_train"]

[[tool.importlinter.contracts]]
name = "pinq_train reaches gold only over HTTP, never by import"
type = "forbidden"
source_modules = ["pinq_train"]
forbidden_modules = ["pi_eval"]

[[tool.importlinter.contracts]]
name = "Nothing may import pinq_train"
type = "forbidden"
source_modules = ["pinq", "pinq_adapters", "pinq_expt", "pi_eval", "pi_run"]
forbidden_modules = ["pinq_train"]
